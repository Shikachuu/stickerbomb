name: Release Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(yq eval '.workspace.package.version' Cargo.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create local git tag for changelog
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/shikachuu/stickerbomb
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=stickerbomb
            org.opencontainers.image.description=Kubernetes operator for labeling resources using Rego policies
            org.opencontainers.image.vendor=shikachuu
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/shikachuu/stickerbomb
            org.opencontainers.image.url=https://github.com/shikachuu/stickerbomb
            org.opencontainers.image.documentation=https://github.com/shikachuu/stickerbomb/blob/main/README.md

      - name: Build and push multi-arch container images
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Generate SPDX SBOM for amd64
        run: |
          trivy image \
            --platform linux/amd64 \
            --format spdx-json \
            --output stickerbomb-${{ steps.version.outputs.version }}-amd64.spdx.json \
            ghcr.io/shikachuu/stickerbomb:${{ steps.version.outputs.version }}

      - name: Generate SPDX SBOM for arm64
        run: |
          trivy image \
            --platform linux/arm64 \
            --format spdx-json \
            --output stickerbomb-${{ steps.version.outputs.version }}-arm64.spdx.json \
            ghcr.io/shikachuu/stickerbomb:${{ steps.version.outputs.version }}

      - name: Package Helm chart
        run: |
          mkdir -p .helm-dist
          helm package charts/stickerbomb \
            --destination .helm-dist \
            --version ${{ steps.version.outputs.version }} \
            --app-version ${{ steps.version.outputs.version }}

      - name: Login to Helm registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to GHCR OCI
        run: |
          helm push .helm-dist/stickerbomb-${{ steps.version.outputs.version }}.tgz \
            oci://ghcr.io/shikachuu/charts

      - name: Generate changelog for release
        run: |
          git cliff --tag ${{ steps.version.outputs.tag }} \
            --unreleased \
            --strip header \
            > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            .helm-dist/stickerbomb-${{ steps.version.outputs.version }}.tgz \
            stickerbomb-${{ steps.version.outputs.version }}-amd64.spdx.json \
            stickerbomb-${{ steps.version.outputs.version }}-arm64.spdx.json
